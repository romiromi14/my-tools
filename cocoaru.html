<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <title>ココアル</title>
    <style>
      :root {
        --bg: #f5f5f7;
        --card: #fff;
        --accent: #ff5ca8;
        --text: #222;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        font-family: -apple-system, "Hiragino Sans", sans-serif;
        background: var(--bg);
        color: var(--text);
        padding-bottom: 90px;
      }
      header {
        background: var(--accent);
        color: #fff;
        padding: 16px;
        font-size: 1.2em;
        font-weight: bold;
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .wrap {
        padding: 12px;
      }
      .card {
        background: var(--card);
        border-radius: 14px;
        padding: 12px;
        margin-bottom: 12px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
      }
      .card img {
        width: 100%;
        border-radius: 10px;
        display: block;
        margin-top: 8px;
      }
      .card .where {
        font-weight: bold;
        font-size: 1.05em;
      }
      .card .what {
        color: #555;
        margin-top: 2px;
      }
      .card .memo {
        color: #777;
        font-size: 0.9em;
        margin-top: 6px;
        white-space: pre-wrap;
      }
      .lock {
        text-align: center;
        padding: 18px;
        color: #999;
      }
      .lock .ico {
        font-size: 1.6em;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .tag {
        font-size: 0.75em;
        background: #ffe3f1;
        color: var(--accent);
        padding: 2px 8px;
        border-radius: 20px;
      }
      button {
        font-family: inherit;
        cursor: pointer;
      }
      .btn {
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 1em;
      }
      .btn.sub {
        background: #eee;
        color: #444;
      }
      .del {
        background: none;
        border: none;
        color: #c44;
        font-size: 0.85em;
        margin-left: auto;
      }
      .fab {
        position: fixed;
        right: 18px;
        bottom: 18px;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: var(--accent);
        color: #fff;
        border: none;
        font-size: 2em;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
        z-index: 20;
      }
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        display: none;
        align-items: flex-end;
        z-index: 30;
      }
      .modal.on {
        display: flex;
      }
      .sheet {
        background: #fff;
        width: 100%;
        border-radius: 18px 18px 0 0;
        padding: 18px;
        max-height: 92vh;
        overflow: auto;
      }
      .sheet h3 {
        margin: 0 0 12px;
      }
      label {
        display: block;
        font-size: 0.85em;
        color: #666;
        margin: 10px 0 4px;
      }
      input[type="text"],
      textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 10px;
        font-size: 1em;
        font-family: inherit;
      }
      textarea {
        min-height: 60px;
        resize: vertical;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 14px 0;
      }
      .check input {
        width: 20px;
        height: 20px;
      }
      .preview {
        width: 100%;
        border-radius: 10px;
        margin-top: 8px;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      .toolbar .btn {
        flex: 1;
      }
      .tiny {
        font-size: 0.78em;
        color: #999;
        margin-top: 8px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <header>📍 ココアル（CocoAru）</header>
    <div class="wrap">
      <div class="toolbar">
        <button class="btn sub" onclick="exportData()">⬇ バックアップ</button>
        <button
          class="btn sub"
          onclick="document.getElementById('imp').click()"
        >
          ⬆ 復元
        </button>
        <input
          type="file"
          id="imp"
          accept="application/json"
          style="display: none"
          onchange="importData(this)"
        />
      </div>
      <p class="tiny">
        「🔒大事」を付けたものは合言葉で暗号化されます。合言葉を忘れると復元できないので注意。
      </p>
      <div id="list"></div>
    </div>

    <button class="fab" onclick="openForm()">＋</button>

    <!-- 入力シート -->
    <div class="modal" id="formModal">
      <div class="sheet">
        <h3 id="formTitle">追加</h3>
        <label>どこに置いた？</label>
        <input
          type="text"
          id="fWhere"
          placeholder="例：寝室のクローゼット上段"
        />
        <label>何を？</label>
        <input type="text" id="fWhat" placeholder="例：通帳・印鑑" />
        <label>メモ（任意）</label>
        <textarea id="fMemo" placeholder="補足があれば"></textarea>
        <label>写真</label>
        <input
          type="file"
          id="fPhoto"
          accept="image/*"
          capture="environment"
          onchange="loadPhoto(this)"
        />
        <img id="preview" class="preview" style="display: none" />
        <div class="check">
          <input type="checkbox" id="fSecret" />
          <label for="fSecret" style="margin: 0"
            >🔒 大事なもの（暗号化する）</label
          >
        </div>
        <div class="toolbar">
          <button class="btn sub" onclick="closeForm()">キャンセル</button>
          <button class="btn" onclick="saveItem()">保存</button>
        </div>
      </div>
    </div>

    <!-- 合言葉シート -->
    <div class="modal" id="pwModal">
      <div class="sheet">
        <h3 id="pwTitle">合言葉</h3>
        <p class="tiny" id="pwMsg"></p>
        <input
          type="password"
          id="pwInput"
          placeholder="合言葉"
          autocomplete="off"
        />
        <div class="toolbar">
          <button class="btn sub" onclick="cancelPw()">キャンセル</button>
          <button class="btn" onclick="submitPw()">OK</button>
        </div>
      </div>
    </div>

    <script>
      const KEY = "okiba_items_v1";
      let items = load();
      let photoData = null; // 入力中の写真(Base64)
      let pwResolve = null; // 合言葉Promise用

      function load() {
        try {
          return JSON.parse(localStorage.getItem(KEY)) || [];
        } catch (e) {
          return [];
        }
      }
      function save() {
        localStorage.setItem(KEY, JSON.stringify(items));
      }

      /* ---------- 写真：圧縮 ---------- */
      function loadPhoto(input) {
        const file = input.files[0];
        if (!file) return;
        const img = new Image();
        const reader = new FileReader();
        reader.onload = (e) => {
          img.src = e.target.result;
        };
        img.onload = () => {
          const max = 800;
          let { width: w, height: h } = img;
          if (w > h && w > max) {
            h = (h * max) / w;
            w = max;
          } else if (h > max) {
            w = (w * max) / h;
            h = max;
          }
          const c = document.createElement("canvas");
          c.width = w;
          c.height = h;
          c.getContext("2d").drawImage(img, 0, 0, w, h);
          photoData = c.toDataURL("image/jpeg", 0.7);
          const p = document.getElementById("preview");
          p.src = photoData;
          p.style.display = "block";
        };
        reader.readAsDataURL(file);
      }

      /* ---------- 暗号化（Web Crypto / AES-GCM + PBKDF2） ---------- */
      async function deriveKey(pw, salt) {
        const enc = new TextEncoder();
        const base = await crypto.subtle.importKey(
          "raw",
          enc.encode(pw),
          "PBKDF2",
          false,
          ["deriveKey"],
        );
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", salt, iterations: 150000, hash: "SHA-256" },
          base,
          { name: "AES-GCM", length: 256 },
          false,
          ["encrypt", "decrypt"],
        );
      }
      function buf2b64(buf) {
        return btoa(String.fromCharCode(...new Uint8Array(buf)));
      }
      function b642buf(b64) {
        return Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
      }

      async function encrypt(obj, pw) {
        const salt = crypto.getRandomValues(new Uint8Array(16));
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const key = await deriveKey(pw, salt);
        const data = new TextEncoder().encode(JSON.stringify(obj));
        const ct = await crypto.subtle.encrypt(
          { name: "AES-GCM", iv },
          key,
          data,
        );
        return { salt: buf2b64(salt), iv: buf2b64(iv), ct: buf2b64(ct) };
      }
      async function decrypt(enc, pw) {
        const key = await deriveKey(pw, b642buf(enc.salt));
        const pt = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: b642buf(enc.iv) },
          key,
          b642buf(enc.ct),
        );
        return JSON.parse(new TextDecoder().decode(pt));
      }

      /* ---------- 合言葉プロンプト ---------- */
      function askPw(title, msg) {
        return new Promise((res) => {
          pwResolve = res;
          document.getElementById("pwTitle").textContent = title;
          document.getElementById("pwMsg").textContent = msg || "";
          document.getElementById("pwInput").value = "";
          document.getElementById("pwModal").classList.add("on");
        });
      }
      function submitPw() {
        const v = document.getElementById("pwInput").value;
        document.getElementById("pwModal").classList.remove("on");
        if (pwResolve) {
          pwResolve(v);
          pwResolve = null;
        }
      }
      function cancelPw() {
        document.getElementById("pwModal").classList.remove("on");
        if (pwResolve) {
          pwResolve(null);
          pwResolve = null;
        }
      }

      /* ---------- 入力フォーム ---------- */
      function openForm() {
        document.getElementById("fWhere").value = "";
        document.getElementById("fWhat").value = "";
        document.getElementById("fMemo").value = "";
        document.getElementById("fPhoto").value = "";
        document.getElementById("fSecret").checked = false;
        document.getElementById("preview").style.display = "none";
        photoData = null;
        document.getElementById("formModal").classList.add("on");
      }
      function closeForm() {
        document.getElementById("formModal").classList.remove("on");
      }

      async function saveItem() {
        const where = document.getElementById("fWhere").value.trim();
        const what = document.getElementById("fWhat").value.trim();
        const memo = document.getElementById("fMemo").value.trim();
        const secret = document.getElementById("fSecret").checked;
        if (!where && !what) {
          alert("「どこ」か「何」のどちらかは入れてね");
          return;
        }

        const payload = { where, what, memo, photo: photoData };

        if (secret) {
          const pw = await askPw(
            "合言葉を設定",
            "この合言葉でロックします。忘れると復元できません。",
          );
          if (!pw) {
            return;
          }
          const enc = await encrypt(payload, pw);
          items.unshift({ id: Date.now(), secret: true, enc });
        } else {
          items.unshift({ id: Date.now(), secret: false, ...payload });
        }
        save();
        render();
        closeForm();
      }

      function delItem(id) {
        if (!confirm("削除する？")) return;
        items = items.filter((i) => i.id !== id);
        save();
        render();
      }

      /* ---------- ロック解除 ---------- */
      async function unlock(id) {
        const it = items.find((i) => i.id === id);
        const pw = await askPw("合言葉を入力", "ロックを解除します");
        if (!pw) return;
        try {
          const data = await decrypt(it.enc, pw);
          showUnlocked(id, data);
        } catch (e) {
          alert("合言葉が違います");
        }
      }
      function showUnlocked(id, d) {
        const el = document.getElementById("card_" + id);
        el.innerHTML = `
    <div class="row"><span class="tag">🔓 解除中</span>
      <button class="del" onclick="delItem(${id})">削除</button></div>
    <div class="where">${esc(d.where)}</div>
    <div class="what">${esc(d.what)}</div>
    ${d.memo ? `<div class="memo">${esc(d.memo)}</div>` : ""}
    ${d.photo ? `<img src="${d.photo}">` : ""}
    <button class="btn sub" style="margin-top:10px;width:100%" onclick="render()">再ロック</button>`;
      }

      /* ---------- 表示 ---------- */
      function esc(s) {
        return (s || "").replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      }
      function render() {
        const list = document.getElementById("list");
        if (items.length === 0) {
          list.innerHTML =
            '<p class="tiny">まだ何もないよ。右下の＋から追加してね。</p>';
          return;
        }
        list.innerHTML = items
          .map((it) => {
            if (it.secret) {
              return `<div class="card" id="card_${it.id}">
        <div class="lock" onclick="unlock(${it.id})">
          <div class="ico">🔒</div>ロック中 — タップして解除</div></div>`;
            }
            return `<div class="card" id="card_${it.id}">
      <div class="row"><span class="where">${esc(it.where)}</span>
        <button class="del" onclick="delItem(${it.id})">削除</button></div>
      <div class="what">${esc(it.what)}</div>
      ${it.memo ? `<div class="memo">${esc(it.memo)}</div>` : ""}
      ${it.photo ? `<img src="${it.photo}">` : ""}
    </div>`;
          })
          .join("");
      }

      /* ---------- バックアップ ---------- */
      function exportData() {
        const blob = new Blob([JSON.stringify(items)], {
          type: "application/json",
        });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download =
          "okiba_backup_" + new Date().toISOString().slice(0, 10) + ".json";
        a.click();
      }
      function importData(input) {
        const file = input.files[0];
        if (!file) return;
        const r = new FileReader();
        r.onload = (e) => {
          try {
            const data = JSON.parse(e.target.result);
            if (!Array.isArray(data)) throw 0;
            if (
              confirm("現在のデータに置き換える？（OK=置換 / キャンセル=中止）")
            ) {
              items = data;
              save();
              render();
            }
          } catch (err) {
            alert("読み込めませんでした");
          }
        };
        r.readAsText(file);
      }

      render();
    </script>
  </body>
</html>
